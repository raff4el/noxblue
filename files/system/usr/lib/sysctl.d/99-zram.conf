# Tuned for zram (see zram-generator.conf.d/override.conf), not disk swap.
# Compressed RAM is orders of magnitude faster to page to than an SSD, so the
# kernel should reach for it early instead of aggressively reclaiming caches.
vm.swappiness=150

# vm.vfs_cache_pressure is deliberately left at the kernel default (100).
# Lowering it made sense when swap was slow; with zram it just holds on to
# dentry/inode caches that could have been zram-backed anonymous memory.

# Swap-in readahead: the default of 3 pulls eight pages per fault, which
# amortises seek cost on a disk. zram has no seek cost, so it only inflates
# the working set with pages nobody asked for.
vm.page-cluster=0

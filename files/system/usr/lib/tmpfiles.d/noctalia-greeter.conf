# noctalia-greeter keeps its state in /var/lib/noctalia-greeter. Two files
# matter, and they have opposite lifecycles:
#
#   greeter.toml  Administrator-controlled, declarative. This image owns it.
#   sync.toml     Written by the greeter itself (last session, last colour
#                 scheme) and by Noctalia's "Sync Now". Never touched here.
#
# greeter.toml wins over sync.toml wherever both set the same key, so anything
# pinned below is genuinely fixed and everything else stays user-controlled.
#
# `C+` (force-copy) rather than `C` (copy-if-missing): /var is machine-local
# and survives image updates, so with plain `C` the very first boot would
# freeze the greeter config forever and later changes in this repo would never
# reach an installed system. If you would rather edit greeter.toml on a running
# system, change `C+` back to `C`.
#
# 0750 and the ownership below match what the greeter's own
# setup_greeter_system.sh does. The user must match `user =` in
# /etc/greetd/config.toml -- on Fedora that is `greetd`, not `greeter`.
# The greeter package ships no tmpfiles.d config of its own, so this is it.
#
# Type  Path                                  Mode  User    Group   Age  Argument
d       /var/lib/noctalia-greeter             0750  greetd  greetd  -    -
C+      /var/lib/noctalia-greeter/greeter.toml 0640 greetd  greetd  -    /usr/share/noctalia-greeter-theme/greeter.toml

# Greeter wallpaper. Unlike dms-greeter there is no magic filename: the path in
# greeter.toml's [appearance.wallpaper] is read literally. To ship one with the
# image, drop a JPEG at
# files/system/usr/share/noctalia-greeter-theme/wallpaper.jpg, uncomment the
# line below, and set `path` under [appearance.wallpaper] in greeter.toml to
# /var/lib/noctalia-greeter/wallpaper.jpg.
#
# Noctalia's "Sync Now" writes its own wallpaper files into this directory
# under different names; those are untouched by this line.
#C+      /var/lib/noctalia-greeter/wallpaper.jpg  0640  greetd  greetd  -  /usr/share/noctalia-greeter-theme/wallpaper.jpg

# The greetd user's own systemd user session.
#
# greetd's RPM %post creates this tree and masks xdg-desktop-portal for the
# greeter, so portals do not start in a session where nobody has logged in yet.
# That scriptlet writes into /var, which is machine-local and not carried in an
# ostree image, so on a rebase the masking is simply absent. Recreate it here.
#
# greetd's own tmpfiles.d only fixes ownership of /var/lib/greetd; it does not
# create this tree.
d       /var/lib/greetd                                   0755  greetd  greetd  -  -
d       /var/lib/greetd/.config                           0755  greetd  greetd  -  -
d       /var/lib/greetd/.config/systemd                   0755  greetd  greetd  -  -
d       /var/lib/greetd/.config/systemd/user              0755  greetd  greetd  -  -
L+      /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service  -  -  -  -  /dev/null

# secureblue runs /usr/libexec/secureblue/verify-provenance.sh before every
# automatic update (ExecStartPre= in /etc/systemd/system/
# rpm-ostreed-automatic.service.d/override.conf). The script only knows
# ghcr.io/secureblue/* and exits 1 for any other image reference, so on this
# image the update is never staged: the unit fails, retries hourly and gives up
# after StartLimitBurst=3, every day.
#
# The empty assignment clears that ExecStartPre list. Drop-ins apply in
# filename order across /etc and /usr/lib, so zz-* lands after override.conf.
# Everything else there (network-online, metered-connection ExecCondition,
# restart limits) still applies.
#
# What remains: every pull goes through ostree-image-signed, so rpm-ostree
# rejects anything not signed with this repo's cosign key. What is lost is the
# SLSA check that the image came from secureblue's own GitHub build, which
# could never pass for this image anyway.
[Service]
ExecStartPre=

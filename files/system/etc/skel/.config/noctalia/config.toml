# Noctalia defaults for new accounts.
#
# /etc/skel is only copied when an account is created, so this does nothing for
# a user that already exists -- including yours, if you rebased onto this image
# rather than installing it. Copy the file into ~/.config/noctalia/ by hand in
# that case.
#
# Noctalia merges every *.toml in ~/.config/noctalia/ alphabetically, so you can
# leave this file alone and add your own settings in a second file next to it.
# Note that settings changed through the GUI land in
# ~/.local/state/noctalia/settings.toml and override both.

[shell]
# Register Noctalia's built-in polkit authentication agent.
#
# secureblue removes sudo, su and pkexec to get rid of suid-root binaries and
# uses run0 instead. polkit itself is still there, and run0 authorizes through
# it -- so something still has to display the prompt, and that something is an
# authentication agent. Noctalia ships one but leaves it off, assuming the
# desktop already supplies one; nothing here does. The Sway Atomic base has
# lxqt-policykit, but only Sway's own config starts it, and Sway is not the
# session here.
#
# DankMaterialShell registered an agent by default, so this is what preserves
# the behaviour you had there. Without it run0 still works in a terminal, where
# it prompts on the tty, but anything started from the shell with no
# controlling terminal has nowhere to put the prompt.
#
# Set to false if you run a different agent.
polkit_agent = true

name: bluebuild
on:
  schedule:
    - cron:
        "30 06 * * *" # build at 06:30 UTC every day
        # (30 minutes after last secureblue images start building)
        #
        # NOTE: GitHub does not deliver `schedule` events to forked
        # repositories. If this repo is still a fork, detach it
        # (Settings -> General -> Leave fork network) or this never fires.
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  validate:
    # A KDL parse error in /etc/niri/config.kdl means no desktop at all on the
    # next boot, and nothing in the image build would notice. Parse it with the
    # same niri Fedora ships for the pinned release before building anything.
    name: Validate configs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Parse TOML configs
        run: |
          set -euo pipefail
          find files -name '*.toml' -print0 | xargs -0 python3 -c '
          import sys, tomllib
          for path in sys.argv[1:]:
              with open(path, "rb") as f:
                  tomllib.load(f)
              print("ok", path)
          '

      - name: Parse niri config with the pinned Fedora release's niri
        run: |
          set -euo pipefail
          # Read the release from the recipe so this cannot drift from the image.
          ver=$(sed -n 's/^image-version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' recipes/recipe.yml)
          test -n "$ver" || { echo "could not read image-version from recipes/recipe.yml" >&2; exit 1; }
          docker run --rm -v "$PWD:/src:ro" -w /src \
            "registry.fedoraproject.org/fedora:$ver" \
            bash -euo pipefail -c '
              dnf -y -q install niri >/dev/null
              niri --version
              niri validate -c files/system/etc/niri/config.kdl
            '

  bluebuild:
    name: Build Custom Image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

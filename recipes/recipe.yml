---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: noxblue
# description will be included in the image's metadata
description: noxblue -- secureblue (hardened Fedora Atomic) with niri + Noctalia.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/silverblue-main-hardened
# NOTE: when bumping this, also bump the hardcoded release in files/dnf/terra.repo
# AND in the `keys:` URL below. Terra is pinned by hand rather than using
# $releasever, because the secureblue base does not necessarily report the
# version this image is built for.
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      # `cleanup` removes this repo from the finished image, so it is used at
      # build time only and is not left behind as a trusted package source for
      # runtime `rpm-ostree install`. Set to false if you want to layer
      # packages from it on a running system.
      cleanup: true
      files:
        # files/dnf/terra.repo. Fyra Labs' Terra, restricted with
        # `includepkgs=noctalia-greeter` so it cannot shadow anything Fedora
        # ships -- see the comments in that file. It is here for exactly one
        # package: noctalia-greeter, which Fedora does not carry. Noctalia
        # itself comes from Fedora's own repos, so no COPR is needed at all.
        - terra.repo
      keys:
        # Required, not optional. `gpgkey=` in the .repo file only tells dnf
        # where the key lives; on an interactive system dnf would offer to
        # import it, but this build is non-interactive, so nothing would.
        # This list is what actually runs `rpm --import`, and without it both
        # `gpgcheck` and `repo_gpgcheck` fail with no key to verify against.
        # Must stay in sync with `gpgkey=` in terra.repo, release included.
        - https://repos.fyralabs.com/terra44/key.asc
    install:
      # niri Recommends waybar, fuzzel, swaylock and xwayland-satellite, all of
      # which are either redundant with Noctalia or (in Xwayland's case)
      # reintroduce X11, which secureblue's DE criteria explicitly want to be
      # disableable. Weak deps are off, so anything actually needed is listed
      # explicitly.
      install-weak-deps: false
      packages:
        # Shell / compositor. Noctalia v5 is a native C++/OpenGL ES shell -- it
        # is not the Quickshell-based v4 line, so there is no `quickshell` here
        # and no separate launcher, bar, notification daemon, lock screen,
        # wallpaper tool or settings app to install alongside it.
        - niri
        - noctalia
        - greetd
        - greetd-selinux
        # Formerly weak deps of noctalia that we do want: DDC/CI brightness on
        # external monitors, battery and power-profile reporting for the bar and
        # Control Center, and the secret store.
        - ddcutil
        - upower
        - gnome-keyring
        # Formerly weak deps of niri that we do want: portals for screencast
        # and file chooser, audio session manager.
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - wireplumber
        # Fonts. Noctalia defaults to `sans-serif` and bundles its own icon
        # font, so nothing here is load-bearing -- these are the families to
        # point `[shell] font_family` at, plus terminal fonts. The nerd-fonts
        # module below registers different family names ("FiraCode Nerd Font"
        # rather than "Fira Code"), which is why both are present.
        - rsms-inter-fonts
        - fira-code-fonts
        # Userland
        - nu
        - alacritty
        - wl-clipboard
        # The one package Fedora does not carry. It is listed here as an
        # ordinary package rather than under a `repo: terra` entry on purpose:
        # that form makes the module run `dnf install --repoid terra`, and
        # --repoid *disables every other repository* for that transaction, so
        # the greeter's dependencies (wlroots >= 0.20, dbus, greetd) become
        # unresolvable. `includepkgs=noctalia-greeter` in files/dnf/terra.repo
        # already guarantees Terra cannot supply anything else -- including its
        # own older `noctalia` build -- so nothing is lost by dropping it.
        - noctalia-greeter
    # gdm is disabled below but still installed. Removing it is possible and
    # would shrink the image, but it is the change most likely to break the
    # build against a future base image, so it is opt-in:
    # remove:
    #   packages:
    #     - gdm
  - type: systemd
    system:
      enabled:
        - greetd.service
      disabled:
        - gdm.service
  - type: brew
    # The formula index refreshes daily, but installed packages are NOT
    # upgraded automatically. Homebrew bottles are prebuilt binaries outside
    # rpm-ostree and outside this image's signing chain, so pulling new ones
    # is a deliberate `brew upgrade`, not a timer. See the README's security
    # trade-offs.
    auto-update: true
    auto-upgrade: false
    update-interval: "1d"
  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        repo:
          title: "Flathub (system)"
        # If no repo information is specified, Flathub will be used by default
        install:
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter
          - com.github.rafostar.Clapper
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages
        repo:
          title: "Flathub (user)"
  # Both font sources are downloaded at build time as plain archives from
  # GitHub and Google, with no signature check -- unlike everything from dnf.
  # Keep the list short: each Nerd Font family is tens of megabytes in the
  # image. NerdFontsSymbolsOnly is the one that matters, since fontconfig
  # falls back to it for glyphs missing from any other monospace font.
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        # Inter is deliberately absent here: rsms-inter-fonts above is the
        # same family from Fedora's signed repos.
        - Roboto
        - Open Sans
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
